# .github/workflows/edge-deploy.yml
# Pipeline completo: lint → testes → build ARM64 → quality gate → deploy

name: Edge AI — Build, Test e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ${{ github.repository }}/yolo-api

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: Lint e testes unitários / smoke / integration
  # Runner: ubuntu-latest (x86_64, gratuito no GitHub)
  # ─────────────────────────────────────────────────────────
  test:
    name: "Lint & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conecta à rede Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r app/requirements.txt
          pip install pytest ruff

      - name: Download modelo para testes
        run: |
          set -euo pipefail

          # Install DVC with ssh support
          pip install --no-cache-dir "dvc[ssh]"

          # Prepare SSH key and agent (use existing secret)
          mkdir -p ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dvc_key
          chmod 600 ~/.ssh/dvc_key

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/dvc_key || true

          # Add remote host key to known_hosts to avoid interactive prompt
          ssh-keyscan -H 100.98.31.83 >> ~/.ssh/known_hosts 2>/dev/null || true

          # Show DVC remotes and config for debugging
          echo "====== .dvc/config ======"
          sed -n '1,200p' .dvc/config || true
          echo "====== dvc remote list ======"
          dvc remote list || true

          # Pull using explicit remote and show verbose logs; fail with diagnostics if needed
          echo "Attempting dvc pull from 'local_remote'..."
          if ! dvc pull -v -r local_remote; then
            echo "dvc pull FAILED — collecting diagnostics..."
            dvc status -c || true
            echo "Local .dvc/cache listing:"
            ls -la .dvc/cache || true
            echo "Looking for .pt files:"
            find . -name "*.pt" -print || true
            exit 1
          fi

      - name: Disponibiliza o modelo em /app/models (mesmo path usado no Docker)
        run: |
          sudo mkdir -p /app
          sudo ln -sfn "$GITHUB_WORKSPACE/models" /app/models
          ls -la /app/models

      - name: Lint (ruff)
        run: ruff check app/

      - name: Testes automatizados
        run: pytest tests/ -v --tb=short


  # ─────────────────────────────────────────────────────────
  # JOB 2: Build da imagem Docker multi-arquitetura
  # Plataforma: linux/arm64 (rpicam-apps-lite não existe para amd64)
  # ─────────────────────────────────────────────────────────
  build:
    name: "Build & Push (ARM64)"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar QEMU (emulação ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e Push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max


  # ─────────────────────────────────────────────────────────
  # JOB 3: Quality gate do modelo
  # Valida mAP@0.5 antes de autorizar o deploy
  # ─────────────────────────────────────────────────────────
  model-gate:
    name: "Model Quality Gate"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conecta à rede Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install ultralytics "dvc[ssh]"

      - name: Recuperar modelo via DVC
        run: |
          set -euo pipefail

          pip install --no-cache-dir "dvc[ssh]"

          mkdir -p ~/.ssh
          echo -e "${{ secrets.RPI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dvc_key
          chmod 600 ~/.ssh/dvc_key

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/dvc_key || true

          # Wait for Tailscale / network and ensure remote reachable
          for i in {1..30}; do
            if ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no isaac@100.98.31.83 "test -d /home/isaac/dvc-storage" 2>/dev/null; then
              echo "✓ SSH connectivity to DVC storage verified"
              break
            fi
            echo "⏳ Waiting for SSH connectivity... (attempt $i/30)"
            sleep 2
          done

          # Add host key to known_hosts (non-interactive)
          ssh-keyscan -H 100.98.31.83 >> ~/.ssh/known_hosts 2>/dev/null || true

          # Ensure cache dir exists
          mkdir -p .dvc/cache/files/md5

          echo "====== .dvc/config ======"
          sed -n '1,200p' .dvc/config || true
          dvc remote list || true
          echo "Attempting dvc pull from 'local_remote' (verbose)..."
          if ! dvc pull --force -v -r local_remote; then
            echo "dvc pull FAILED — diagnostics:"
            dvc status -c || true
            echo ".dvc/cache listing:"
            ls -la .dvc/cache || true
            echo "Remote listing (attempting from runner):"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no isaac@100.98.31.83 'ls -la /home/isaac/dvc-storage/files/md5 || true'
            echo "Workspace .pt files:"
            find . -name "*.pt" -print || true
            exit 1
          fi

          # Verify dataset and model exist as before
          if [ ! -d "dataset/exports/epi-v1/valid/images" ]; then
            echo "ERROR: Dataset images directory not found after pull"
            ls -la dataset/exports/epi-v1/ || echo "Directory does not exist"
            exit 1
          fi

          # Verify model file exists
          if [ ! -f "models/yolo-epi.pt" ]; then
            echo "ERROR: Model file not found at models/yolo-epi.pt"
            find . -name "*.pt" -type f 2>/dev/null || echo "No .pt files found"
            exit 1
          fi

      # - name: Recuperar dataset via DVC
      #   run: dvc pull dataset/exports/epi-v1

      - name: Executar quality gate com dataset customizado
        run: |
          python scripts/validate_model.py \
            --model models/yolo-epi.pt \
            --dataset dataset/exports/epi-v1/data.yaml \
            --threshold 0.60


  # ─────────────────────────────────────────────────────────
  # JOB 4: Deploy no Raspberry Pi 5 via SSH
  # Executa apenas em push para main (não em PRs)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: "Deploy → Raspberry Pi 5"
    needs: model-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conecta à rede Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH com rollback automático
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key:      ${{ secrets.RPI_SSH_KEY }}
          command_timeout: 30m
          script: |
            export DEPLOY_PATH=${{ secrets.RPI_DEPLOY_PATH }}
            cd $DEPLOY_PATH
            git pull origin main
            bash scripts/deploy.sh

      - name: Notificar resultado
        if: always()
        run: |
          echo "Deploy status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
